name: Python application checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python source syntax
        run: |
          python -m compileall -q .
      - name: Run unit tests
        run: |
          python -m unittest -v
      - name: Verify main menu exits successfully
        run: |
          printf '0\n' | python main.py
